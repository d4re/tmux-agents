# syntax=docker/sandbox-kit:3
# tmux-agents state kit — added by tmux-agents to every sandbox it creates.
#
# Declaration-only mixin: persistent block volumes (volume@1) for the agent
# state that must survive `sbx rm` + `sbx create` under the same sandbox
# name (agent-rebuild, restore of a deleted sandbox). sbx keys volume
# storage on (owner, sandbox name, path) — NOT on this kit's identity — so
# the kit can move or change without orphaning data.
#
# Sizes are set once and are effectively permanent: an unsized volume gets
# ~512 MB, and sbx (0.55) silently reattaches a retained volume at its
# ORIGINAL size — there is no local resize or delete (`sbx volume` is
# cloud-only). Changing a size here only affects sandbox names that never
# had that volume; an existing project moves to fresh volumes via
# `sbx_name`. Adding a NEW path is fine (fresh storage). Ownership +
# permissions are fixed in the root startup hook, not `mode` (a fresh mount
# may be root-owned).
#
# Not here, deliberately: ~/.claude/skills (sbx's shared skills mount —
# sbx rejects volumes hiding it, which is also why ~/.claude can't be one
# volume); settings.json / .claude.json / codex config.toml (regenerated by
# the agent mixins on every create); codex auth.json (a proxy placeholder).
schemaVersion: "3"
kind: mixin
displayName: tmux-agents state
description: Persistent agent state (sessions, memory, scratchpad, history) across sandbox recreation
# Order this kit's hooks after the agent mixins (their install hooks seed
# ~/.claude and ~/.codex) without requiring them.
integrates: ["claude", "codex"]
capabilities:
  - type: com.docker.sandbox/volume@1
    description: Claude sessions + auto-memory
    config:
      path: /home/agent/.claude/projects
      size: 4g
  - type: com.docker.sandbox/volume@1
    description: Claude file checkpoints (rewind)
    config:
      path: /home/agent/.claude/file-history
      size: 2g
  - type: com.docker.sandbox/volume@1
    description: Claude todo lists
    config:
      path: /home/agent/.claude/todos
      size: 256m
  - type: com.docker.sandbox/volume@1
    description: Claude plans
    config:
      path: /home/agent/.claude/plans
      size: 256m
  - type: com.docker.sandbox/volume@1
    description: Claude per-session scratchpads (uid 1000)
    config:
      path: /tmp/claude-1000
      size: 16g
  - type: com.docker.sandbox/volume@1
    description: Codex sessions
    config:
      path: /home/agent/.codex/sessions
      size: 2g
  - type: com.docker.sandbox/volume@1
    description: Single-file state (prompt histories), symlinked into place
    config:
      path: /home/agent/.local/state/tmux-agents
      size: 256m
  - type: com.docker.sandbox/lifecycle@1
    config:
      startup:
        - description: Own the volume roots; keep the scratchpad root private
          user: "0"
          command: |
            set -e
            for d in /home/agent/.claude/projects /home/agent/.claude/file-history \
                     /home/agent/.claude/todos /home/agent/.claude/plans \
                     /tmp/claude-1000 /home/agent/.codex/sessions \
                     /home/agent/.local/state/tmux-agents; do
              mkdir -p "$d"
              chown agent:agent "$d"
            done
            chown agent:agent /home/agent/.claude /home/agent/.codex \
              /home/agent/.local /home/agent/.local/state
            chmod 700 /tmp/claude-1000
        - description: Link single-file state (prompt histories) into the state volume
          user: agent
          command: |
            set -e
            store=/home/agent/.local/state/tmux-agents
            for rel in .claude/history.jsonl .codex/history.jsonl; do
              link=/home/agent/$rel
              target=$store/$(echo "$rel" | tr / _)
              # A real file at the link path (written before this hook ever
              # ran) is adopted into the store unless the store already has one.
              if [ -f "$link" ] && [ ! -L "$link" ]; then
                if [ -e "$target" ]; then rm -f "$link"; else mv "$link" "$target"; fi
              fi
              touch "$target"
              ln -sfn "$target" "$link"
            done
